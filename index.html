<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Disney+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="./dist/css/main.css">
</head>
<body> 
   <section class="hero">
    <div class="hero__content">
        <h1 class="hero__branding">
            <img src="./src/images/disneyplus.svg" alt="Disney+">
        </h1>
        <h3 class="title--small"> Aqui as melhores historias em um só lugar.</h3>
        <p>
            <a href="#" class="link-text">Assinar o Disney+</a>
            <br>
            <span class="text">R$ 27,90/mês o R$ 279,90/ano à vista*</span>
        </p>
        <ul class="hero__combos">
            <li class="hero__combos__combo">
                <img src="./src/images/logos/disney_star_plus.png" alt="Disney+ - Star+ - Combo+">
                <button>Assine Agora</button>
                <span class="text">R$ 45,90/mês*</span>
            </li>
            <li class="hero__combos__combo">
                <img src="./src/images/logos/disney_star_plus.png" alt="Disney+ - Star+ - Combo+">
                <button>Assine Agora</button>
                <span class="text">R$ 45,90/mês*</span>
            </li>
        </ul>
        <p class="text--small">O preço pode variar caso a assinatura seja feita através de outras plataformas.</p>
    </div>
   </section>
   <section class="shows">
    <nav class="shows__tabs">
        <button data-tab-button="em_breve" class="shows__tabs__button shows__tabs__button--is-active"> Em Breve</button>
            
        <button data-tab-button="mais_populares" class="shows__tabs__button ">Mais Populares</button>
            
        <button data-tab-button="mais_no_starplus" class="shows__tabs__button ">Mais no Star+</button>
            
    </nav>
    <ul data-tab-id="em_breve" class="shows__list shows__list--is-active">
        <li class="shows__list__item">
            <img src="./src/images/em_breve/spidey.jpg" alt="Spidey"
            width="430"
            height="278">
            
        </li>
        <li class="shows__list__item">
            <img src="./src/images/em_breve/desencantada.jpg" alt="Desencantada"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/em_breve/lobisomem.jpg" alt="Lobisomem na noite"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/em_breve/sem_limites.jpg" alt="Sem limites"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/em_breve/the_santa_clauses.jpg" alt="The Santa Clauses"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/em_breve/willow.jpg" alt="Willow"
            width="430"
            height="278">
        </li>
    </ul>
    <ul data-tab-id="mais_populares" class="shows__list ">
        <li class="shows__list__item">
            <img src="./src/images/mais_populares/bluey.jpg" alt="Bluey"
            width="430"
            height="278">
            
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_populares/cavaleira_da_lua.jpg" alt="Cavaleiro da Lua"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_populares/o_incrivel_dr_pol.jpg" alt="O incrivel dr Pol"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_populares/obi_wan.jpg" alt="Obi Wan"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_populares/red.jpg" alt="Red"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_populares/tudo_igual_sqn.jpg" alt="Tudo igual sqn"
            width="430"
            height="278">
        </li>
    </ul>
    <ul data-tab-id="mais_no_starplus" class="shows__list ">
        <li class="shows__list__item">
            <img src="./src/images/mais_no_star_plus/belair.jpg" alt="Belair"
            width="430"
            height="278">
            
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_no_star_plus/libertadores.jpg" alt="Libertadores"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_no_star_plus/nba.jpg" alt="NBA"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_no_star_plus/os_simpson.jpg" alt="Os Simpsons"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_no_star_plus/premier_league.jpg" alt="Premier League"
            width="430"
            height="278">
        </li>
        <li class="shows__list__item">
            <img src="./src/images/mais_no_star_plus/the_kardashians.jpg" alt="The Kardashians"
            width="430"
            height="278">
        </li>
    </ul>
   </section>
   <script src="./src/main.js"></script>
</body>
</html>
